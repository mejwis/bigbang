name: Deploy latest BIG BANG build

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - ".github/workflows/deploy-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v6

      - name: Najít nejnovější HTML build
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE=$(find . -maxdepth 1 -type f \
            -name "big-bang*.html" \
            ! -name "index.html" \
            -printf "%T@ %p\n" \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)

          if [ -z "$BUILD_FILE" ]; then
            echo "Nebyl nalezen žádný BIG BANG HTML build."
            exit 1
          fi

          echo "Publikuji: $BUILD_FILE"

          mkdir -p public
          cp "$BUILD_FILE" public/index.html

      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrát Pages balíček
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publikovat GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
