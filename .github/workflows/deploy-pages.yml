name: Deploy latest BIG BANG build

on:
  push:
    branches:
      - main
    paths:
      - "big-bang*.html"
      - ".github/workflows/deploy-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v6

      - name: Připravit aktuální BIG BANG build
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE=$(git diff-tree \
            --no-commit-id \
            --name-only \
            -r "$GITHUB_SHA" \
            | grep -E '^big-bang.*\.html$' \
            | tail -n 1 || true)

          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find . -maxdepth 1 -type f \
              -name "big-bang*.html" \
              | sort \
              | tail -n 1)
          fi

          if [ -z "$BUILD_FILE" ] || [ ! -f "$BUILD_FILE" ]; then
            echo "Nebyl nalezen žádný BIG BANG HTML build."
            exit 1
          fi

          echo "Publikuji: $BUILD_FILE"

          rm -rf public
          mkdir -p public
          cp "$BUILD_FILE" public/index.html

      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrát Pages balíček
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publikovat GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
